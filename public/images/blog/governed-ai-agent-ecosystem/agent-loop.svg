<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 304" width="760" height="304" role="img" aria-label="The agent proposes, the script decides" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.5" y="0.5" width="759" height="303" rx="12" fill="#0c0a09" stroke="#292524"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57534e"/></marker></defs>
<text x="24" y="34" font-size="15" font-weight="600" fill="#e7e5e4" text-anchor="start">The agent proposes, the script decides</text>
<text x="24" y="54" font-size="11.5" font-weight="400" fill="#a8a29e" text-anchor="start">Reading is free. Anything that writes goes through you and a guard.</text>
<path d="M230.0 110H280.0" fill="none" stroke="#57534e" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M480.0 110H530.0" fill="none" stroke="#57534e" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M680 138.0V222.0" fill="none" stroke="#57534e" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M580 222.0V138.0" fill="none" stroke="#57534e" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M530.0 250H480.0" fill="none" stroke="#57534e" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M280.0 250H230.0" fill="none" stroke="#57534e" stroke-width="1.25" marker-end="url(#arrow)"/>
<rect x="30.0" y="82.0" width="200" height="56" rx="8" fill="#1c1917" stroke="#57534e" stroke-width="1.25"/>
<text x="130" y="106" font-size="13" font-weight="600" fill="#e7e5e4" text-anchor="middle">You ask</text>
<text x="130" y="124" font-size="11.5" font-weight="400" fill="#a8a29e" text-anchor="middle">plain words, in chat</text>
<rect x="280.0" y="82.0" width="200" height="56" rx="8" fill="#1c1917" stroke="#57534e" stroke-width="1.25"/>
<text x="380" y="106" font-size="13" font-weight="600" fill="#e7e5e4" text-anchor="middle">Agent reads and plans</text>
<text x="380" y="124" font-size="11.5" font-weight="400" fill="#a8a29e" text-anchor="middle">tools via MCP, no asking</text>
<rect x="530.0" y="82.0" width="200" height="56" rx="8" fill="#1c1917" stroke="#57534e" stroke-width="1.25"/>
<text x="630" y="106" font-size="13" font-weight="600" fill="#e7e5e4" text-anchor="middle">Preview</text>
<text x="630" y="124" font-size="11.5" font-weight="400" fill="#a8a29e" text-anchor="middle">the exact change, unapplied</text>
<rect x="530.0" y="222.0" width="200" height="56" rx="8" fill="#1c1917" stroke="#57534e" stroke-width="1.25"/>
<text x="630" y="246" font-size="13" font-weight="600" fill="#e7e5e4" text-anchor="middle">You approve</text>
<text x="630" y="264" font-size="11.5" font-weight="400" fill="#a8a29e" text-anchor="middle">this exact version only</text>
<rect x="280.0" y="222.0" width="200" height="56" rx="8" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-width="2"/>
<text x="380" y="246" font-size="13" font-weight="600" fill="#e7e5e4" text-anchor="middle">Guarded script applies</text>
<text x="380" y="264" font-size="11.5" font-weight="400" fill="#e7e5e4" text-anchor="middle">only if the code matches</text>
<rect x="30.0" y="222.0" width="200" height="56" rx="8" fill="#1c1917" stroke="#57534e" stroke-width="1.25"/>
<text x="130" y="246" font-size="13" font-weight="600" fill="#e7e5e4" text-anchor="middle">Verify and log</text>
<text x="130" y="264" font-size="11.5" font-weight="400" fill="#a8a29e" text-anchor="middle">flags anything unapproved</text>
<text x="572" y="184" font-size="11.5" font-weight="400" fill="#a8a29e" text-anchor="end">any edit = new preview</text>
