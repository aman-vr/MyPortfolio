<text x="560" y="120" font-size="13" font-weight="600" fill="#e7e5e4" text-anchor="start">Docs</text>
<text x="560" y="136" font-size="11.5" font-weight="400" fill="#a8a29e" text-anchor="start">Philosophy, working style</text>
<text x="560" y="152" font-size="11.5" font-weight="400" fill="#a8a29e" text-anchor="start">and a rebuild guide</text>
<text x="560" y="168" font-size="11.5" font-weight="400" fill="#a8a29e" text-anchor="start">Rebuild from 3 files</text>
<rect x="544" y="248" width="192" height="72" rx="8" fill="#1c1917" stroke="#57534e" stroke-width="1.25"/>
<text x="560" y="272" font-size="13" font-weight="600" fill="#e7e5e4" text-anchor="start">Health check</text>
