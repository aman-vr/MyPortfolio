<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-label="Rules flow down, and the stricter rule always wins" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.5" y="0.5" width="759" height="519" rx="12" fill="#0c0a09" stroke="#292524"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57534e"/></marker></defs>
<text x="24" y="34" font-size="15" font-weight="600" fill="#e7e5e4" text-anchor="start">Rules flow down, and the stricter rule always wins</text>
<text x="24" y="54" font-size="11.5" font-weight="400" fill="#a8a29e" text-anchor="start">Highlighted: the layer where rules become enforcement</text>
<path d="M36 80V488" fill="none" stroke="#57534e" stroke-width="1.25" marker-end="url(#arrow)"/>
<rect x="56" y="76" width="456" height="56" rx="8" fill="#1c1917" stroke="#57534e" stroke-width="1.25"/>
<text x="72" y="100" font-size="13" font-weight="600" fill="#e7e5e4" text-anchor="start">Personal rules file</text>
<text x="72" y="116" font-size="11.5" font-weight="400" fill="#a8a29e" text-anchor="start">Never commit. Ask before reading secrets. Short and absolute.</text>
<rect x="56" y="148" width="456" height="56" rx="8" fill="#1c1917" stroke="#57534e" stroke-width="1.25"/>
<text x="72" y="172" font-size="13" font-weight="600" fill="#e7e5e4" text-anchor="start">Guardrails</text>
<text x="72" y="188" font-size="11.5" font-weight="400" fill="#a8a29e" text-anchor="start">Tiers 0 to 3: runs freely, needs approval, needs naming, never</text>
<rect x="56" y="220" width="456" height="56" rx="8" fill="#1c1917" stroke="#57534e" stroke-width="1.25"/>
<text x="72" y="244" font-size="13" font-weight="600" fill="#e7e5e4" text-anchor="start">Standards</text>
<text x="72" y="260" font-size="11.5" font-weight="400" fill="#a8a29e" text-anchor="start">Code quality, docs, testing, security, logging and retention</text>
<rect x="56" y="292" width="456" height="56" rx="8" fill="#1c1917" stroke="#57534e" stroke-width="1.25"/>
<text x="72" y="316" font-size="13" font-weight="600" fill="#e7e5e4" text-anchor="start">Skills (SKILL.md)</text>
<text x="72" y="332" font-size="11.5" font-weight="400" fill="#a8a29e" text-anchor="start">When to use, when not to, workflow and hard rules</text>
<rect x="56" y="364" width="456" height="56" rx="8" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-width="2"/>
<text x="72" y="388" font-size="13" font-weight="600" fill="#e7e5e4" text-anchor="start">Scripts and guards</text>
<text x="72" y="404" font-size="11.5" font-weight="400" fill="#e7e5e4" text-anchor="start">Change guard, approval codes, secret stops, no delete script</text>
<rect x="56" y="436" width="456" height="56" rx="8" fill="#1c1917" stroke="#57534e" stroke-width="1.25"/>
<text x="72" y="460" font-size="13" font-weight="600" fill="#e7e5e4" text-anchor="start">Config</text>
<text x="72" y="476" font-size="11.5" font-weight="400" fill="#a8a29e" text-anchor="start">Settings only: limits and protected patterns. No credentials</text>
<path d="M512 104H528V176H512M528 140H544" fill="none" stroke="#57534e" stroke-width="1.25"/>
<path d="M512 248H528V320H512M528 284H544" fill="none" stroke="#57534e" stroke-width="1.25"/>
<path d="M512 392H544" fill="none" stroke="#57534e" stroke-width="1.25"/>
