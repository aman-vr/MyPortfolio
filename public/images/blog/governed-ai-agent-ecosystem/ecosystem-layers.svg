<text x="560" y="304" font-size="11.5" font-weight="400" fill="#a8a29e" text-anchor="start">and guards; flags drift</text>
<rect x="544" y="356" width="192" height="72" rx="8" fill="#1c1917" stroke="#57534e" stroke-width="1.25"/>
<text x="560" y="380" font-size="13" font-weight="600" fill="#e7e5e4" text-anchor="start">Pester tests</text>
<text x="560" y="396" font-size="11.5" font-weight="400" fill="#a8a29e" text-anchor="start">100+ tests try to get</text>
<text x="560" y="412" font-size="11.5" font-weight="400" fill="#a8a29e" text-anchor="start">past every guard</text>
